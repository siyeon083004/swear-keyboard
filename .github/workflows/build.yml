name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o SwearKeyboard.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - working-directory: SwearKeyboard
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: swear-keyboard-apk
          path: SwearKeyboard/app/build/outputs/apk/debug/app-debug.apk
