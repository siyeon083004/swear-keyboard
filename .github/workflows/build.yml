name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 제일 최근에 올린 zip 풀기
        run: |
          f=$(git log --format= --name-only --diff-filter=AM -- '*.zip' | grep -v '^$' | head -1)
          [ -z "$f" ] && f=SwearKeyboard.zip
          echo "사용하는 파일: $f"
          rm -rf SwearKeyboard
          unzip -o "$f"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - working-directory: SwearKeyboard
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: swear-keyboard-apk
          path: SwearKeyboard/app/build/outputs/apk/debug/app-debug.apk
